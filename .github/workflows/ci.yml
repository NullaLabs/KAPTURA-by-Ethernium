name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate KAPTURA product boundary
        run: python tests/validate_kaptura.py
      - name: Python CLI converter unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run full Node test suite (Studio + Daemon + EBWP)
        run: npm test
      - name: Honesty contract logic test
        run: node tests/test_contract_logic.js
