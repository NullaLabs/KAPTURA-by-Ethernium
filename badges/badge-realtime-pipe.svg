<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Fira+Code:wght@700&amp;display=swap');
      
      .btn-text-realtime-pipe {
        font-family: 'Nebula', 'Orbitron', 'Fira Code', monospace;
        font-weight: 900;
        font-size: 11px;
        fill: #FFFFFF !important;
        stroke: #000000;
        stroke-width: 1.5px;
        paint-order: stroke fill;
        letter-spacing: 1.4px;
        filter: drop-shadow(0 0 6px #00FF9DCC);
      }

      .glow-border-realtime-pipe {
        animation: borderGlow-realtime-pipe 4s ease-in-out infinite alternate;
      }

      @keyframes borderGlow-realtime-pipe {
        0% { stroke: #00E5FF; filter: drop-shadow(0 0 4px #00E5FF); }
        50% { stroke: #00FF9D; filter: drop-shadow(0 0 6px #00FF9D); }
        100% { stroke: #00E5FF; filter: drop-shadow(0 0 4px #00E5FF); }
      }

      .sheen-move-realtime-pipe {
        animation: moveSheen-realtime-pipe 3.5s ease-in-out infinite alternate;
      }

      @keyframes moveSheen-realtime-pipe {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(140px); }
      }

      .pulse-dot-realtime-pipe {
        animation: pulse-realtime-pipe 1.8s infinite;
      }
      
      @keyframes pulse-realtime-pipe {
        0% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
        50% { fill: #00E5FF; opacity: 0.3; filter: drop-shadow(0 0 2px #00E5FF); }
        100% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
      }
    </style>

    <clipPath id="clip-realtime-pipe">
      <rect width="280" height="48" rx="12" />
    </clipPath>

    <linearGradient id="obsidian-realtime-pipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="30%" stop-color="#070B14" />
      <stop offset="70%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <linearGradient id="bevel-realtime-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="sheen-realtime-pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.12" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid-realtime-pipe" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00FF9D" stroke-width="0.3" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <g clip-path="url(#clip-realtime-pipe)">
    <rect width="280" height="48" rx="12" fill="url(#obsidian-realtime-pipe)" />
    <rect width="280" height="48" fill="url(#grid-realtime-pipe)" />
    <line x1="0" y1="0" x2="280" y2="0" stroke="url(#bevel-realtime-pipe)" stroke-width="2" />
    <line x1="0" y1="48" x2="280" y2="48" stroke="url(#bevel-realtime-pipe)" stroke-width="2" opacity="0.6" />
    
    <path class="sheen-move-realtime-pipe" d="M 0 0 L 70 0 L 30 48 L -40 48 Z" fill="url(#sheen-realtime-pipe)" />
  </g>

  <rect class="glow-border-realtime-pipe" x="1" y="1" width="278" height="46" rx="11" fill="none" stroke-width="1.5" />

  <circle class="pulse-dot-realtime-pipe" cx="24" cy="24" r="4.5" />
  <circle cx="24" cy="24" r="8" fill="none" stroke="#00FF9D" stroke-width="1" opacity="0.4" />

  <text class="btn-text-realtime-pipe" x="44" y="28">REALTIME PIPE // LOW JITTER</text>
</svg>